<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Checkout 3DS AssetPay Visual</title>
  <script src="https://cdn.jsdelivr.net/npm/@fingerprintjs/fingerprintjs@3/dist/fp.min.js"></script>
  <script src="https://api.assetpagamentos.com.br/v1/js"></script>
  <style>
    body { font-family: Arial; padding: 20px; }
    input, button { display: block; margin: 10px 0; padding: 8px; width: 300px; }
    #result { background: #eee; padding: 10px; margin-top: 10px; white-space: pre-wrap; }
    #threeDSModal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6); justify-content: center; align-items: center;
    }
    #threeDSModal iframe {
      width: 400px; height: 600px; border: none; background: #fff;
    }
  </style>
</head>
<body>
  <h1>Checkout 3DS AssetPay Visual</h1>

  <label>Número do cartão:</label>
  <input id="cardNumber" type="text" value="2310382286341907">
  <label>Nome do titular:</label>
  <input id="holderName" type="text" value="EMERSON SANTOS">
  <label>Expiração (MM/AA):</label>
  <input id="expMonth" type="text" value="07">
  <input id="expYear" type="text" value="30">
  <label>CVV:</label>
  <input id="cvv" type="text" value="444">
  <button id="submitBtn">Finalizar Compra</button>

  <pre id="result"></pre>

  <!-- Modal 3DS -->
  <div id="threeDSModal">
    <iframe id="threeDSIframe"></iframe>
  </div>

  <script>
    AssetPay.setPublicKey("pk_live_v2D5sJPOcIhr7OFQn6aMUzb80GDHT3BXHz");
    AssetPay.setTestMode(true); // true para sandbox
    const fpPromise = FingerprintJS.load();

    const modal = document.getElementById('threeDSModal');
    const iframe = document.getElementById('threeDSIframe');
    const resultPre = document.getElementById('result');

    document.getElementById('submitBtn').addEventListener('click', async () => {
      try {
        // Ajusta o expYear para 4 dígitos
        let yearInput = document.getElementById('expYear').value;
        let expYear = yearInput.length === 2 ? '20' + yearInput : yearInput;

        const cardData = {
          number: document.getElementById('cardNumber').value,
          holderName: document.getElementById('holderName').value,
          expMonth: parseInt(document.getElementById('expMonth').value),
          expYear: parseInt(expYear),
          cvv: document.getElementById('cvv').value
        };

        // 1️⃣ VisitorId
        const fp = await fpPromise;
        const visitorId = (await fp.get()).visitorId;

        // 2️⃣ Token do cartão
        const token = await AssetPay.encrypt(cardData);

        resultPre.textContent = `🆔 VisitorId: ${visitorId}\n✅ Token gerado:\n${JSON.stringify(token, null, 2)}\nEnviando para backend...`;

        // 3️⃣ Envia token + visitorId para o backend
        const response = await fetch('https://monkeycheckout.online/vakinha-luky/pagamento-cartao.php', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ visitorId, token: token.id })
        });
        const json = await response.json();
        console.log('Resposta backend:', json);
        resultPre.textContent += '\n\n✅ Resposta backend:\n' + JSON.stringify(json, null, 2);

        // 4️⃣ Abrir 3DS se houver URL
        if(json.threeDSUrl){
          iframe.src = json.threeDSUrl;
          modal.style.display = 'flex';
        }

      } catch(err){
        console.error('Erro no fluxo 3DS:', err);
        resultPre.textContent = '❌ Erro:\n' + err;
      }
    });

    // Fecha modal clicando fora do iframe
    modal.addEventListener('click', (e) => {
      if(e.target === modal) modal.style.display = 'none';
    });
  </script>
</body>
</html>
