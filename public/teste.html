<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste AssetPay com 3DS</title>
    <script src="https://api.assetpagamentos.com.br/v1/js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fingerprintjs/fingerprintjs@3/dist/fp.min.js"></script>
</head>
<body>
    <h1>Teste AssetPay com Autenticação 3DS</h1>
    
    <form id="cardForm">
        <div>
            <label>Número do Cartão:</label>
            <input type="text" id="cardNumber" value="2310382286341907" maxlength="19">
        </div>
        <div>
            <label>Nome no Cartão:</label>
            <input type="text" id="holderName" value="EMERSON SANTOS">
        </div>
        <div>
            <label>Mês de Expiração:</label>
            <input type="number" id="expMonth" value="7" min="1" max="12">
        </div>
        <div>
            <label>Ano de Expiração:</label>
            <input type="number" id="expYear" value="2030" min="2024" max="2040">
        </div>
        <div>
            <label>CVV:</label>
            <input type="text" id="cvv" value="444" maxlength="4">
        </div>
        <button type="button" onclick="processPayment()">Processar Pagamento com 3DS</button>
    </form>

    <div id="result"></div>

    <script>
        const log = (message, data = null) => {
            const timestamp = new Date().toISOString();
            console.log(`[${timestamp}] ${message}`, data || '');
            
            const resultDiv = document.getElementById('result');
            const logEntry = document.createElement('div');
            logEntry.innerHTML = `<strong>[${timestamp}] ${message}</strong>`;
            if (data) {
                logEntry.innerHTML += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            }
            resultDiv.appendChild(logEntry);
        };

        async function processPayment() {
            try {
                log('🟢 Iniciando checkout com 3DS...');
                
                log('🔍 Verificando disponibilidade da biblioteca AssetPay...');
                if (typeof AssetPay === 'undefined') {
                    throw new Error('AssetPay library not loaded');
                }
                log('✅ AssetPay library disponível', {
                    methods: Object.getOwnPropertyNames(AssetPay),
                    version: AssetPay.version || 'unknown'
                });
                
                // Coletar dados do cartão
                log('📋 Coletando dados do formulário...');
                const rawCardData = {
                    number: document.getElementById('cardNumber').value,
                    holderName: document.getElementById('holderName').value,
                    expMonth: document.getElementById('expMonth').value,
                    expYear: document.getElementById('expYear').value,
                    cvv: document.getElementById('cvv').value
                };
                log('📋 Dados brutos coletados', rawCardData);
                
                const cardData = {
                    number: rawCardData.number.replace(/\s/g, ''),
                    holderName: rawCardData.holderName,
                    expMonth: parseInt(rawCardData.expMonth),
                    expYear: parseInt(rawCardData.expYear),
                    cvv: rawCardData.cvv
                };
                
                log('📇 Dados do cartão processados', {
                    ...cardData,
                    number: cardData.number.substring(0, 6) + '****' + cardData.number.substring(cardData.number.length - 4),
                    cvv: '***'
                });

                log('🔍 Validando dados do cartão...');
                const validations = {
                    numberLength: cardData.number.length >= 13 && cardData.number.length <= 19,
                    holderNameLength: cardData.holderName.length >= 2,
                    expMonthRange: cardData.expMonth >= 1 && cardData.expMonth <= 12,
                    expYearRange: cardData.expYear >= 2024 && cardData.expYear <= 2040,
                    cvvLength: cardData.cvv.length >= 3 && cardData.cvv.length <= 4
                };
                log('✅ Validações dos dados', validations);
                
                if (!Object.values(validations).every(v => v)) {
                    throw new Error('Dados do cartão inválidos: ' + JSON.stringify(validations));
                }

                // Gerar fingerprint
                log('🆔 Iniciando geração de fingerprint...');
                const fp = await FingerprintJS.load();
                log('🆔 FingerprintJS carregado', { version: fp.version || 'unknown' });
                
                const fpResult = await fp.get();
                const visitorId = fpResult.visitorId;
                
                log('🆔 VisitorId gerado', { 
                    visitorId, 
                    confidence: fpResult.confidence,
                    components: Object.keys(fpResult.components || {}).length
                });

                // Configurar AssetPay
                log('⚙️ Configurando AssetPay...');
                const publicKey = 'pk_live_v2D5sJPOcIhr7OFQn6aMUzb80GDHT3BXHz';
                log('⚙️ Usando chave pública', { key: publicKey.substring(0, 20) + '...' });
                
                AssetPay.setPublicKey(publicKey);
                log('✅ Chave pública configurada');
                
                AssetPay.setTestMode(false);
                log('✅ Modo de produção ativado');

                const tokenizeData = {
                    number: cardData.number,
                    holderName: cardData.holderName,
                    expMonth: cardData.expMonth,
                    expYear: cardData.expYear,
                    cvv: cardData.cvv
                };
                log('🔐 Dados preparados para tokenização', {
                    ...tokenizeData,
                    number: tokenizeData.number.substring(0, 6) + '****' + tokenizeData.number.substring(tokenizeData.number.length - 4),
                    cvv: '***',
                    expMonthType: typeof tokenizeData.expMonth,
                    expYearType: typeof tokenizeData.expYear
                });

                // Tokenizar cartão
                log('🔐 Iniciando tokenização do cartão...');
                const cardToken = await AssetPay.encrypt(tokenizeData);
                
                log('🔑 Token do cartão gerado', {
                    token: cardToken.substring(0, 20) + '...',
                    tokenLength: cardToken.length,
                    tokenType: typeof cardToken
                });

                const threeDSData = {
                    token: cardToken,
                    amount: 1000,
                    currency: "brl",
                    installments: 1,
                    card: {
                        number: cardData.number,
                        holderName: cardData.holderName,
                        expMonth: cardData.expMonth.toString().padStart(2, '0'),
                        expYear: cardData.expYear.toString().slice(-2),
                        cvv: cardData.cvv
                    },
                    holderName: cardData.holderName,
                    email: "cliente@exemplo.com",
                    cpf: "12345678909"
                };
                
                log('🔒 Dados preparados para 3DS', {
                    ...threeDSData,
                    token: threeDSData.token.substring(0, 20) + '...',
                    card: {
                        ...threeDSData.card,
                        number: threeDSData.card.number.substring(0, 6) + '****' + threeDSData.card.number.substring(threeDSData.card.number.length - 4),
                        cvv: '***',
                        expMonthType: typeof threeDSData.card.expMonth,
                        expYearType: typeof threeDSData.card.expYear
                    }
                });

                // Executar autenticação 3DS
                log('🔒 Executando autenticação 3DS...');
                const threeDSResult = await AssetPay.authenticate3DS(threeDSData);
                
                log('✅ Autenticação 3DS concluída', {
                    id: threeDSResult.id,
                    threeDSecureId: threeDSResult.threeDSecureId,
                    status: threeDSResult.status,
                    resultType: typeof threeDSResult,
                    allKeys: Object.keys(threeDSResult)
                });

                const payload = {
                    amount: 1000,
                    cardToken: cardToken,
                    threeDSecureId: threeDSResult.id || threeDSResult.threeDSecureId,
                    deviceFingerprint: visitorId,
                    cardData: cardData,
                    name: "Cliente Real",
                    email: "cliente@exemplo.com",
                    cpf: "12345678909",
                    phone: "11999999999",
                    description: "Produto LEGO",
                    installments: 1
                };
                
                log('📤 Payload preparado para backend', {
                    ...payload,
                    cardToken: payload.cardToken.substring(0, 20) + '...',
                    cardData: {
                        ...payload.cardData,
                        number: payload.cardData.number.substring(0, 6) + '****' + payload.cardData.number.substring(payload.cardData.number.length - 4),
                        cvv: '***'
                    },
                    payloadSize: JSON.stringify(payload).length
                });

                // Enviar para backend
                const backendUrl = 'https://monkeycheckout.online/vakinha-luky/pagamento-cartao.php';
                log('🌐 Enviando requisição HTTP', { url: backendUrl, method: 'POST' });
                
                const response = await fetch(backendUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                log('📄 Resposta HTTP recebida', { 
                    status: response.status,
                    statusText: response.statusText,
                    headers: Object.fromEntries(response.headers.entries()),
                    ok: response.ok
                });
                
                const responseData = await response.text();
                log('📄 Resposta HTTP body (raw)', { 
                    data: responseData,
                    length: responseData.length,
                    type: typeof responseData
                });

                let paymentResult;
                try {
                    paymentResult = JSON.parse(responseData);
                    log('✅ Parse JSON da resposta bem-sucedido', paymentResult);
                } catch (parseError) {
                    log('❌ Erro ao fazer parse JSON da resposta', {
                        error: parseError.message,
                        rawData: responseData.substring(0, 500)
                    });
                    throw new Error('Resposta inválida do servidor: ' + parseError.message);
                }
                
                log('✅ Checkout concluído com 3DS', {
                    success: paymentResult.success,
                    message: paymentResult.message,
                    allKeys: Object.keys(paymentResult)
                });

            } catch (error) {
                log('❌ Erro durante o checkout', {
                    message: error.message,
                    stack: error.stack,
                    name: error.name,
                    cause: error.cause
                });
            }
        }
    </script>
</body>
</html>
