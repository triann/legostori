<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Checkout 3DS AssetPay - Dados Reais</title>
  <script src="https://cdn.jsdelivr.net/npm/@fingerprintjs/fingerprintjs@3/dist/fp.min.js"></script>
  <script src="https://api.assetpagamentos.com.br/v1/js"></script>
  <style>
    body { font-family: Arial; padding: 20px; }
    input, button { display: block; margin: 10px 0; padding: 8px; width: 300px; }
    #result { background: #eee; padding: 10px; margin-top: 10px; white-space: pre-wrap; max-height: 400px; overflow-y: auto; }
    #threeDSModal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.6); justify-content:center; align-items:center; }
    #threeDSModal iframe { width: 400px; height: 600px; border: none; background: #fff; }
  </style>
</head>
<body>
  <h1>Checkout 3DS AssetPay - Dados Reais</h1>

  <label>Número do cartão:</label>
  <input id="cardNumber" type="text">
  <label>Nome do titular:</label>
  <input id="holderName" type="text">
  <label>Expiração (MM/AAAA):</label>
  <input id="expMonth" type="text">
  <input id="expYear" type="text">
  <label>CVV:</label>
  <input id="cvv" type="text">
  <button id="submitBtn">Finalizar Compra</button>

  <pre id="result"></pre>

  <div id="threeDSModal">
    <iframe id="threeDSIframe"></iframe>
  </div>

  <script>
    AssetPay.setPublicKey("pk_live_v2D5sJPOcIhr7OFQn6aMUzb80GDHT3BXHz");
    AssetPay.setTestMode(false);

    const fpPromise = FingerprintJS.load();
    const modal = document.getElementById('threeDSModal');
    const iframe = document.getElementById('threeDSIframe');
    const resultPre = document.getElementById('result');

    function log(msg, obj=null){
      const timestamp = new Date().toISOString();
      if(obj) console.log(`[${timestamp}] ${msg}`, obj);
      else console.log(`[${timestamp}] ${msg}`);
      resultPre.textContent += `\n[${timestamp}] ${msg}` + (obj ? `\n${JSON.stringify(obj, null, 2)}` : '');
    }

    async function fetchWithLogging(url, options){
      log("🌐 Enviando requisição HTTP", {url, options});
      const response = await fetch(url, options);
      const text = await response.text();
      log(`📄 Resposta HTTP status: ${response.status}`, text);
      try{
        return JSON.parse(text);
      }catch(e){
        log("⚠️ Não foi possível parsear JSON da resposta", e);
        return {rawResponse: text};
      }
    }

    document.getElementById('submitBtn').addEventListener('click', async () => {
      try {
        log("🟢 Iniciando checkout...");

        // Coleta dados do cartão
        let yearInput = document.getElementById('expYear').value;
        let expYear = parseInt(yearInput.length === 2 ? '20' + yearInput : yearInput, 10);
        let expMonth = parseInt(document.getElementById('expMonth').value, 10);
        const cardData = {
          number: document.getElementById('cardNumber').value.trim(),
          holderName: document.getElementById('holderName').value.trim(),
          expMonth,
          expYear,
          cvv: document.getElementById('cvv').value.trim()
        };
        log("📇 Dados do cartão coletados", cardData);

        // VisitorId
        const fp = await fpPromise;
        const visitorData = await fp.get();
        const visitorId = visitorData.visitorId;
        log("🆔 VisitorId gerado", visitorData);

        // Token do cartão
        const cardToken = await AssetPay.encrypt(cardData); // ✅ usar diretamente
        if(!cardToken) throw new Error("❌ Token do cartão não foi gerado corretamente");
        log("🔑 Token do cartão gerado", cardToken);

        // Envia para backend
        const payload = {
          amount: 1000,
          cardToken,
          deviceFingerprint: visitorId,
          cardData,
          name: "Cliente Real",
          email: "cliente@exemplo.com",
          cpf: "12345678909",
          phone: "11999999999",
          description: "Produto LEGO",
          installments: 1
        };
        log("📤 Payload enviado para backend", payload);

        const json = await fetchWithLogging('https://monkeycheckout.online/vakinha-luky/pagamento-cartao.php', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify(payload)
        });

        if(json.threeDSUrl){
          log("🔐 Iniciando autenticação 3DS", json.threeDSUrl);
          iframe.src = json.threeDSUrl;
          modal.style.display = 'flex';
        } else {
          log("✅ Checkout concluído sem 3DS", json);
        }

      } catch(err){
        console.error("❌ Erro no checkout:", err);
        resultPre.textContent += `\n❌ Erro no checkout:\n${err.stack || err}`;
      }
    });

    modal.addEventListener('click', (e) => {
      if(e.target === modal) modal.style.display = 'none';
    });
  </script>
</body>
</html>
