<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste AssetPay com 3DS</title>
    <script src="https://api.assetpagamentos.com.br/v1/js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fingerprintjs/fingerprintjs@3/dist/fp.min.js"></script>
</head>
<body>
    <h1>Teste AssetPay com Autenticação 3DS</h1>
    
    <form id="cardForm">
        <div>
            <label>Número do Cartão:</label>
            <input type="text" id="cardNumber" value="2310382286341907" maxlength="19">
        </div>
        <div>
            <label>Nome no Cartão:</label>
            <input type="text" id="holderName" value="EMERSON SANTOS">
        </div>
        <div>
            <label>Mês de Expiração:</label>
            <input type="number" id="expMonth" value="7" min="1" max="12">
        </div>
        <div>
            <label>Ano de Expiração:</label>
            <input type="number" id="expYear" value="2030" min="2024" max="2040">
        </div>
        <div>
            <label>CVV:</label>
            <input type="text" id="cvv" value="444" maxlength="4">
        </div>
        <button type="button" onclick="processPayment()">Processar Pagamento com 3DS</button>
    </form>

    <div id="result"></div>

    <script>
        const log = (message, data = null) => {
            const timestamp = new Date().toISOString();
            console.log(`[${timestamp}] ${message}`, data || '');
            
            const resultDiv = document.getElementById('result');
            const logEntry = document.createElement('div');
            logEntry.innerHTML = `<strong>[${timestamp}] ${message}</strong>`;
            if (data) {
                logEntry.innerHTML += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            }
            resultDiv.appendChild(logEntry);
        };

        async function processPayment() {
            try {
                log('🟢 Iniciando checkout com 3DS...');
                
                // Coletar dados do cartão
                const cardData = {
                    number: document.getElementById('cardNumber').value.replace(/\s/g, ''),
                    holderName: document.getElementById('holderName').value,
                    expMonth: parseInt(document.getElementById('expMonth').value),
                    expYear: parseInt(document.getElementById('expYear').value),
                    cvv: document.getElementById('cvv').value
                };
                
                log('📇 Dados do cartão coletados', cardData);

                // Gerar fingerprint
                const fp = await FingerprintJS.load();
                const fpResult = await fp.get();
                const visitorId = fpResult.visitorId;
                
                log('🆔 VisitorId gerado', { visitorId, confidence: fpResult.confidence });

                // Configurar AssetPay
                log('⚙️ Configurando AssetPay...');
                AssetPay.setPublicKey('pk_live_v2D5sJPOcIhr7OFQn6aMUzb80GDHT3BXHz');
                AssetPay.setTestMode(false);

                // Tokenizar cartão
                log('🔐 Tokenizando cartão...');
                const cardToken = await AssetPay.encrypt({
                    number: cardData.number,
                    holderName: cardData.holderName,
                    expMonth: cardData.expMonth,
                    expYear: cardData.expYear,
                    cvv: cardData.cvv
                });
                
                log('🔑 Token do cartão gerado', cardToken);

                // Executar autenticação 3DS
                log('🔒 Executando autenticação 3DS...');
                const threeDSResult = await AssetPay.authenticate3DS({
                    token: cardToken,
                    amount: 1000,
                    currency: "brl",
                    installments: 1,
                    card: {
                        number: cardData.number,
                        holderName: cardData.holderName,
                        expirationMonth: cardData.expMonth,
                        expirationYear: cardData.expYear,
                        cvv: cardData.cvv
                    },
                    holderName: cardData.holderName,
                    email: "cliente@exemplo.com",
                    cpf: "12345678909"
                });
                
                log('✅ Autenticação 3DS concluída', threeDSResult);

                // Preparar payload para backend
                const payload = {
                    amount: 1000,
                    cardToken: cardToken,
                    threeDSecureId: threeDSResult.id || threeDSResult.threeDSecureId,
                    deviceFingerprint: visitorId,
                    cardData: cardData,
                    name: "Cliente Real",
                    email: "cliente@exemplo.com",
                    cpf: "12345678909",
                    phone: "11999999999",
                    description: "Produto LEGO",
                    installments: 1
                };
                
                log('📤 Payload enviado para backend', payload);

                // Enviar para backend
                log('🌐 Enviando requisição HTTP');
                const response = await fetch('https://monkeycheckout.online/vakinha-luky/pagamento-cartao.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                log('📄 Resposta HTTP status:', response.status);
                const responseData = await response.text();
                log('📄 Resposta HTTP body:', responseData);

                const paymentResult = JSON.parse(responseData);
                log('✅ Checkout concluído com 3DS', paymentResult);

            } catch (error) {
                log('❌ Erro durante o checkout', {
                    message: error.message,
                    stack: error.stack
                });
            }
        }
    </script>
</body>
</html>
